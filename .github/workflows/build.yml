name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compila APK
        run: gradle assembleRelease --no-daemon

      - name: Rinomina
        run: cp app/build/outputs/apk/release/app-release.apk OrologioARibalta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OrologioARibalta
          path: OrologioARibalta.apk

      - name: Pubblica come download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orologio-v${{ github.run_number }}
          name: Orologio a ribalta ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: OrologioARibalta.apk
